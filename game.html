<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Groundwork</title>
<meta name="description" content="Groundwork, a small platform game by Telpe. Run, jump and stomp your way across the site.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: on a desktop, a quiet frame around the game (header + fitted canvas). On a phone, or in
   fullscreen, the canvas is the whole screen and everything else lives inside it. */
:root{
  --bg:#fbfbfd;--fg:#1d1d1f;--fg-2:#86868b;--line:rgba(29,29,31,.08);--accent:#3d5afe;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--fg-2:#8e8e93;--line:rgba(245,245,247,.10);--accent:#5b78ff;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--fg-2:#8e8e93;--line:rgba(245,245,247,.10);--accent:#5b78ff;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

.app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) clamp(12px,3vw,32px) env(safe-area-inset-bottom,0px)}
header{flex:none;display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px}
.brand svg{width:20px;height:20px}
.brand .sep{color:var(--fg-2);font-weight:400}
.tools{display:flex;gap:8px}
.tools button{border:1px solid var(--line);background:none;border-radius:999px;height:32px;min-width:32px;padding:0 12px;font-size:12px;color:var(--fg-2);cursor:pointer;white-space:nowrap}
.tools button:hover{color:var(--fg)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding-block:6px 14px}
canvas{display:block;border-radius:18px;box-shadow:0 24px 60px -24px rgba(0,0,0,.35);background:#bfe0ff;touch-action:none;max-width:100%;max-height:100%}

/* full-bleed: phones always, desktops in fullscreen */
body.full .app{padding:0}
body.full header{display:none}
body.full .stage{padding:0;display:block}
body.full canvas{border-radius:0;box-shadow:none;width:100%;height:100%;max-width:none;max-height:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="brand" href="index.html" aria-label="Back to Telpe">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="2.4" fill="var(--accent)"/></svg>
      Telpe <span class="sep">/</span> <span class="sub">Groundwork</span>
    </a>
    <div class="tools">
      <button type="button" id="mute" aria-pressed="false" aria-label="Sound">Sound on</button>
      <button type="button" id="full" aria-label="Fullscreen">Fullscreen</button>
    </div>
  </header>
  <div class="stage" id="stage"><canvas id="game" width="960" height="544" aria-label="Groundwork game" role="img"></canvas></div>
</div>

<script>
(function(){
'use strict';
const TILE=16, ROWS=17, VH=TILE*ROWS, S=2;
let VW=480, VHv=VH, offY=0, scale=2;        // visible logical size; offY = where the world sits vertically
const GRAV=0.32, JUMP=-5.9, RUN=2.3, MAXFALL=7.2;
const cv=document.getElementById('game'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
const FONT='Geist, -apple-system, system-ui, sans-serif';
const touchDevice=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0);

/* ---------- Levels ----------
   ground: [fromCol, toCol, heightInTiles=2]   plat: [col,row,len]   blocks: [col,row]
   spikes/coins: [col,row,len]   enemies: [col, rowTheyStandOn, type]   signs: [col,text]
   check: [col,...]  flag: col.  Rows count from the top; the default ground top is row 15. */
const LEVELS=[
{name:'Groundwork',w:150,sky:['#bfe0ff','#f2f8ff'],far:'#c9d9ec',near:'#a4bbd8',lit:false,
 ground:[[0,36],[40,74],[74,86,3],[86,104],[108,150]],
 plat:[[27,12,4],[58,12,4],[64,10,3],[92,12,3]],
 blocks:[[14,12],[15,12],[16,12],[48,11],[50,11],[52,11]],
 spikes:[[116,14,2],[128,14,3]],
 coins:[[6,13,3],[27,10,4],[64,8,3],[89,13,2],[92,10,3],[120,13,4]],
 enemies:[[24,15,'cone'],[44,15,'cone'],[60,12,'cone'],[96,15,'bolt'],[112,15,'cone'],[124,15,'cone'],[134,15,'bolt']],
 signs:[[4,'RUN  ▶'],[11,'JUMP  ▲'],[21,'JUMP ON THEM'],[47,'HIT FROM BELOW'],[76,'CHECKPOINT'],[138,'FINISH ▶']],
 check:[78],flag:144},
{name:'Scaffold',w:170,sky:['#9fd0ff','#e6f3ff'],far:'#b9cde6',near:'#8da8cc',lit:false,
 ground:[[0,20],[24,40,3],[40,52,4],[56,80],[84,100,3],[100,118,5],[122,150],[154,170]],
 plat:[[8,12,3],[12,10,3],[30,11,3],[44,10,3],[62,12,3],[66,10,3],[70,8,3],[90,11,3],[106,9,3],[128,12,4],[136,12,3],[142,10,3]],
 blocks:[[13,7],[31,8],[47,7],[63,9],[91,8],[107,6],[129,9],[130,9]],
 spikes:[[58,14,2],[74,14,3],[124,14,2],[147,14,2]],
 coins:[[2,13,3],[12,8,3],[30,9,3],[44,8,3],[70,6,3],[76,13,3],[90,9,3],[106,7,3],[110,10,4],[136,10,3],[142,8,3],[160,13,4]],
 enemies:[[14,15,'cone'],[33,14,'cone'],[46,13,'bolt'],[60,15,'cone'],[66,10,'cone'],[94,14,'bolt'],[110,12,'cone'],[114,12,'cone'],[132,15,'bolt'],[140,15,'cone'],[160,15,'cone'],[164,15,'bolt']],
 signs:[],check:[88],flag:165},
{name:'Steelwork',w:190,sky:['#ffb57c','#ffe7cf'],far:'#d9a08a',near:'#a86f66',lit:true,
 ground:[[0,16],[20,34],[38,50,3],[54,66],[66,78,4],[78,90,6],[94,110],[114,126],[130,146,3],[150,172],[176,190]],
 plat:[[6,12,3],[24,12,2],[28,10,2],[42,11,3],[58,12,3],[82,8,3],[98,12,3],[102,10,2],[118,12,3],[134,11,3],[138,9,3],[156,12,3],[160,10,3],[164,8,3]],
 blocks:[[7,9],[29,7],[43,8],[59,9],[83,5],[103,7],[119,9],[139,6],[165,5]],
 spikes:[[22,14,2],[62,14,3],[106,14,3],[122,14,2],[152,14,3],[168,14,3]],
 coins:[[2,13,3],[6,10,3],[24,10,2],[28,8,2],[42,9,3],[58,10,3],[70,11,3],[82,6,3],[98,10,3],[118,10,3],[134,9,3],[138,7,3],[156,10,3],[164,6,3],[180,13,4]],
 enemies:[[10,15,'cone'],[26,15,'bolt'],[44,14,'cone'],[56,15,'cone'],[60,12,'cone'],[70,13,'bolt'],[84,11,'cone'],[86,11,'cone'],[100,15,'bolt'],[116,15,'cone'],[120,15,'bolt'],[136,14,'cone'],[140,9,'cone'],[158,15,'bolt'],[162,15,'cone'],[180,15,'cone'],[184,15,'bolt']],
 signs:[],check:[96],flag:185},
{name:'Topping Out',w:210,sky:['#1b2440','#3b4b7c'],far:'#2a3458',near:'#1a2140',lit:true,
 ground:[[0,14],[18,30,3],[30,42,5],[46,60],[64,76,4],[80,96],[100,112,3],[112,124,5],[124,136,7],[140,160],[164,178,3],[182,196],[200,210]],
 plat:[[4,12,3],[8,10,3],[22,11,3],[34,9,3],[50,12,3],[54,10,3],[68,10,3],[84,12,3],[88,10,3],[92,8,3],[104,11,3],[116,9,3],[128,7,3],[132,5,3],[144,12,3],[148,10,3],[152,8,3],[168,11,3],[172,9,3],[186,12,3],[190,10,3]],
 blocks:[[9,7],[23,8],[35,6],[55,7],[69,7],[93,5],[105,8],[117,6],[133,2],[153,5],[173,6],[191,7]],
 spikes:[[48,14,2],[58,14,2],[82,14,3],[94,14,2],[142,14,3],[157,14,2],[184,14,3]],
 coins:[[8,8,3],[22,9,3],[34,7,3],[54,8,3],[68,8,3],[92,6,3],[104,9,3],[116,7,3],[128,5,3],[132,3,3],[152,6,3],[172,7,3],[190,8,3],[203,13,4]],
 enemies:[[6,15,'bolt'],[10,10,'cone'],[20,14,'cone'],[24,11,'cone'],[36,12,'bolt'],[38,12,'cone'],[52,15,'cone'],[56,10,'cone'],[66,13,'bolt'],[70,10,'cone'],[86,15,'cone'],[90,10,'cone'],[102,14,'bolt'],[106,11,'cone'],[114,12,'cone'],[118,9,'cone'],[126,10,'bolt'],[130,7,'cone'],[146,15,'bolt'],[150,10,'cone'],[166,14,'cone'],[170,11,'cone'],[174,9,'cone'],[188,15,'bolt'],[192,10,'cone'],[203,15,'cone'],[206,15,'bolt']],
 signs:[],check:[88,150],flag:205}
];

const T={EMPTY:0,GROUND:1,FILL:2,STEEL:3,BLOCK:4,USED:5,SPIKE:6,BRICK:8};
const SOLID=[false,true,true,true,true,true,false,false,true];

/* ---------- Audio (tiny synth) ---------- */
let AC=null, muted=false;
try{ muted = localStorage.getItem('gw_muted')==='1'; }catch(e){}
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol){
  const ac=audio(); if(!ac||muted)return;
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.05,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const sfx={
  jump(){tone(260,620,0.14,'square',0.04);},
  coin(){tone(880,1480,0.12,'sine',0.06);setTimeout(()=>tone(1320,1760,0.1,'sine',0.04),60);},
  stomp(){tone(220,80,0.14,'triangle',0.08);},
  bump(){tone(180,120,0.08,'square',0.05);},
  hurt(){tone(300,60,0.45,'sawtooth',0.06);},
  life(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.12,'square',0.05),i*90));},
  flag(){[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f*1.01,0.18,'triangle',0.06),i*110));},
  check(){tone(600,900,0.12,'sine',0.05);},
  tap(){tone(500,700,0.06,'sine',0.03);}
};

/* ---------- Helpers ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

/* ---------- Build a level ---------- */
let L=null, grid=null, GW=0;
let coins=[], enemies=[], signs=[], checks=[], flag=null, bumps=[], particles=[], popups=[];
const at=(c,r)=>(c<0||c>=GW||r<0||r>=ROWS)?0:grid[r*GW+c];
const setT=(c,r,v)=>{if(c>=0&&c<GW&&r>=0&&r<ROWS)grid[r*GW+c]=v;};
const solid=(c,r)=>!!SOLID[at(c,r)];
function groundTop(c){for(let r=0;r<ROWS;r++)if(solid(c,r))return r;return ROWS;}
function makeEnemy(type,c,row){
  const w=type==='cone'?12:13,h=13;
  return {type,x:c*TILE+(TILE-w)/2,y:row*TILE-h,w,h,vx:type==='cone'?-0.55:-1.05,vy:0,onGround:false,dead:false,deadT:0,ang:0,t:Math.random()*10};
}
function build(idx){
  L=LEVELS[idx]; GW=L.w; grid=new Uint8Array(GW*ROWS);
  for(const [a,b,h=2] of L.ground){const top=ROWS-h;for(let c=a;c<b;c++){setT(c,top,T.GROUND);for(let r=top+1;r<ROWS;r++)setT(c,r,T.FILL);}}
  for(const [c,r,n] of L.plat)for(let i=0;i<n;i++)setT(c+i,r,T.STEEL);
  for(const [c,r] of L.blocks)setT(c,r,T.BLOCK);
  for(const [c,r,n=1] of L.spikes)for(let i=0;i<n;i++)setT(c+i,r,T.SPIKE);
  coins=[];for(const [c,r,n=1] of L.coins)for(let i=0;i<n;i++)coins.push({x:(c+i)*TILE+8,y:r*TILE+8,got:false,t:Math.random()*6});
  enemies=L.enemies.map(([c,row,type])=>makeEnemy(type,c,row));
  signs=L.signs.map(([c,text])=>({x:c*TILE,row:groundTop(c)-1,text}));
  checks=L.check.map(c=>({x:c*TILE,row:groundTop(c),on:false}));
  flag={x:L.flag*TILE,row:groundTop(L.flag),raise:0};
  bumps=[];particles=[];popups=[];
  const r=rng(idx*7919+17);
  L._far=[];let x=0;while(x<1400){const w=20+r()*40,h=40+r()*110;L._far.push({x,w,h});x+=w+2+r()*10;}L._farW=x;
  L._near=[];x=0;while(x<1800){const w=28+r()*56,h=24+r()*90;L._near.push({x,w,h,crane:r()<0.18});x+=w+6+r()*26;}L._nearW=x;
  L._clouds=[];for(let i=0;i<14;i++)L._clouds.push({x:r()*1200,y:r(),s:0.6+r()*0.9});
}

/* ---------- Player & state ---------- */
const P={x:0,y:0,w:12,h:14,vx:0,vy:0,onGround:false,face:1,coyote:0,buffer:0,walk:0,sq:1,st:1,deadT:0};
let state='title', level=0, lives=3, blueprints=0, levelFrames=0, totalFrames=0, camX=0, spawn={x:0,y:0}, best=0, overlayT=0, flashT=0;
try{ best=parseInt(localStorage.getItem('gw_best')||'0',10)||0; }catch(e){}
function spawnAt(x,y){P.x=x;P.y=y;P.vx=0;P.vy=0;P.onGround=false;P.face=1;P.coyote=0;P.buffer=0;P.sq=1;P.st=1;}
function startLevel(idx){
  level=idx;build(idx);levelFrames=0;
  spawn={x:2*TILE+2,y:(groundTop(2))*TILE-P.h};spawnAt(spawn.x,spawn.y);
  camX=0;state='play';overlayT=0;
  try{ if(idx+1>best){best=idx+1;localStorage.setItem('gw_best',String(best));} }catch(e){}
}
function respawn(){enemies=L.enemies.map(([c,row,type])=>makeEnemy(type,c,row));spawnAt(spawn.x,spawn.y);state='play';}

/* ---------- Input: keyboard ---------- */
const held={left:false,right:false,jump:false};let jumpPressed=false,anyPressed=false,axis=0,touchJumpUntil=0;
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'jump',KeyK:'jump'};
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')state='paused';else if(state==='paused')state='play';return;}
  if(e.code==='KeyM'){toggleMute();return;}
  if(e.code==='KeyF'){toggleFull();return;}
  const k=KEYS[e.code];
  if(k){ if(!e.repeat){ if(k==='jump')jumpPressed=true; anyPressed=true; } held[k]=true; }
  else if(!e.repeat){ anyPressed=true; }
  audio();
});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)held[k]=false;});
addEventListener('blur',()=>{held.left=held.right=held.jump=false;});

/* ---------- Input: touch & mouse on the canvas ----------
   Drag anywhere = a floating stick (appears under the finger). Tap = jump. A quick swipe up while
   dragging = jump too. A second finger tapping anywhere = jump. No buttons. */
const ptrs=new Map();let stickId=null,stick=null,menuHits=[];
function toLogical(e){const b=cv.getBoundingClientRect();return {x:(e.clientX-b.left)/b.width*VW,y:(e.clientY-b.top)/b.height*VHv};}
function hitRect(p,r){return r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;}
let usedDrag=false,usedJump=false;
function touchJump(){jumpPressed=true;touchJumpUntil=performance.now()+240;usedJump=true;if(usedDrag)hintShown=true;}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();audio();
  const q=toLogical(e),now=performance.now();
  const p={id:e.pointerId,x0:q.x,y0:q.y,x:q.x,y:q.y,t0:now,moved:false,isStick:false,hist:[{y:q.y,t:now}],swipeUntil:0,type:e.pointerType};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  ptrs.set(e.pointerId,p);
  if(state==='play'){
    if(hitRect(q,pauseRect)){p.isPause=true;return;}
    if(stickId===null){stickId=e.pointerId;p.isStick=true;stick=p;}
    else touchJump();                       // second finger: jump right away
  }
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const q=toLogical(e),now=performance.now();p.x=q.x;p.y=q.y;
  if(Math.hypot(q.x-p.x0,q.y-p.y0)>7)p.moved=true;
  if(p.isStick&&state==='play'){
    const dx=q.x-p.x0;
    if(dx>44)p.x0=q.x-44;else if(dx<-44)p.x0=q.x+44;     // floating stick: re-anchors so you can turn without going all the way back
    const d=q.x-p.x0;axis=Math.abs(d)<6?0:clamp((d-Math.sign(d)*6)/34,-1,1);
    if(axis!==0){usedDrag=true;if(usedJump)hintShown=true;}
    p.hist.push({y:q.y,t:now});while(p.hist.length&&now-p.hist[0].t>170)p.hist.shift();
    if(now>p.swipeUntil){for(const h of p.hist){if(h.y-q.y>24){touchJump();p.swipeUntil=now+320;break;}}}
  }
});
function ptrEnd(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  const now=performance.now(),tap=!p.moved&&now-p.t0<300;
  if(p.isStick){stickId=null;stick=null;axis=0;}
  if(state==='play'){
    if(p.isPause){if(tap){state='paused';overlayT=0;sfx.tap();}return;}
    if(tap)touchJump();
  } else if(state==='paused'){
    if(tap){const hit=menuHits.find(r=>hitRect({x:p.x,y:p.y},r));if(hit){hit.act();}else if(!hitRect({x:p.x,y:p.y},panelRect))state='play';}
  } else if(tap){anyPressed=true;}
}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('lostpointercapture',e=>{if(ptrs.has(e.pointerId))ptrEnd(e);});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Sound, fullscreen, layout mode ---------- */
const muteBtn=document.getElementById('mute');
function renderMute(){muteBtn.textContent=muted?'Sound off':'Sound on';muteBtn.setAttribute('aria-pressed',muted?'true':'false');}
function toggleMute(){muted=!muted;try{localStorage.setItem('gw_muted',muted?'1':'0');}catch(e){}renderMute();}
muteBtn.addEventListener('click',()=>{audio();toggleMute();});renderMute();
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const canFull=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function toggleFull(){
  const el=document.documentElement;
  if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;if(x)x.call(document);return;}
  const r=el.requestFullscreen||el.webkitRequestFullscreen;if(!r)return;
  try{const pr=r.call(el);if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock){const lp=screen.orientation.lock('landscape');if(lp&&lp.catch)lp.catch(()=>{});}}catch(e){}
}
document.getElementById('full').addEventListener('click',toggleFull);
if(!canFull)document.getElementById('full').hidden=true;
function updateMode(){document.body.classList.toggle('full',touchDevice||!!fsEl());fit();}
document.addEventListener('fullscreenchange',updateMode);document.addEventListener('webkitfullscreenchange',updateMode);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')state='paused';});

// safe-area insets (notch) so the HUD never hides under it
const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(probe);
let inset={t:0,r:0,b:0,l:0};
function readInsets(){const cs=getComputedStyle(probe);const full=document.body.classList.contains('full');inset={t:full?(parseFloat(cs.paddingTop)||0)/scale:0,r:full?(parseFloat(cs.paddingRight)||0)/scale:0,b:full?(parseFloat(cs.paddingBottom)||0)/scale:0,l:full?(parseFloat(cs.paddingLeft)||0)/scale:0};}

/* ---------- Physics ---------- */
function collideX(e){
  e.x+=e.vx;e.hitWall=false;
  const y0=Math.floor((e.y+2)/TILE),y1=Math.floor((e.y+e.h-3)/TILE);
  if(e.vx>0){const c=Math.floor((e.x+e.w)/TILE);for(let r=y0;r<=y1;r++)if(solid(c,r)){e.x=c*TILE-e.w-0.01;e.vx=0;e.hitWall=true;break;}}
  else if(e.vx<0){const c=Math.floor(e.x/TILE);for(let r=y0;r<=y1;r++)if(solid(c,r)){e.x=(c+1)*TILE+0.01;e.vx=0;e.hitWall=true;break;}}
}
function collideY(e,isPlayer){
  e.y+=e.vy;e.onGround=false;
  const x0=Math.floor((e.x+2)/TILE),x1=Math.floor((e.x+e.w-3)/TILE);
  if(e.vy>=0){const r=Math.floor((e.y+e.h)/TILE);for(let c=x0;c<=x1;c++)if(solid(c,r)){e.y=r*TILE-e.h;e.vy=0;e.onGround=true;break;}}
  else{const r=Math.floor(e.y/TILE);let hit=null,bestD=1e9;const cx=e.x+e.w/2;
    for(let c=x0;c<=x1;c++)if(solid(c,r)){const d=Math.abs((c+0.5)*TILE-cx);if(d<bestD){bestD=d;hit=c;}}
    if(hit!==null){e.y=(r+1)*TILE;e.vy=0;if(isPlayer)headHit(hit,r);}}
}
function headHit(c,r){
  const t=at(c,r);
  if(t===T.BLOCK){setT(c,r,T.USED);blueprints++;sfx.coin();bumps.push({c,r,t:0});popups.push({x:c*TILE+8,y:r*TILE-6,text:'+1',t:0});
    for(let i=0;i<6;i++)particles.push({x:c*TILE+8,y:r*TILE,vx:(Math.random()-0.5)*2,vy:-1-Math.random()*2,life:28,color:'#fff'});
    checkLife();
    for(const en of enemies){if(!en.dead&&Math.abs(en.x+en.w/2-(c+0.5)*TILE)<TILE&&Math.abs(en.y+en.h-r*TILE)<2)killEnemy(en,true);}
  } else {sfx.bump();bumps.push({c,r,t:0});}
}
function checkLife(){if(blueprints%20===0){lives++;sfx.life();popups.push({x:P.x+6,y:P.y-10,text:'+1 LIFE',t:0});}}
function killEnemy(en,fling){
  en.dead=true;en.deadT=0;
  if(en.type==='bolt'||fling){en.vy=-3.6;en.vx=(Math.random()<0.5?-1:1)*1.2;en.fling=true;}
  for(let i=0;i<6;i++)particles.push({x:en.x+en.w/2,y:en.y+en.h,vx:(Math.random()-0.5)*2.4,vy:-Math.random()*1.6,life:22,color:'rgba(0,0,0,.25)'});
}
function overlap(a,b,pad){pad=pad||0;return a.x+pad<b.x+b.w-pad&&a.x+a.w-pad>b.x+pad&&a.y+pad<b.y+b.h-pad&&a.y+a.h-pad>b.y+pad;}
function die(){if(state!=='play')return;state='dead';P.deadT=0;P.vy=-5.2;P.vx=0;sfx.hurt();flashT=12;}

/* ---------- Update ---------- */
function update(){
  const now=performance.now();
  if(state==='title'||state==='paused'||state==='levelDone'||state==='gameover'||state==='win'){
    overlayT++;
    if(anyPressed&&overlayT>20){
      anyPressed=false;jumpPressed=false;
      if(state==='title'){lives=3;blueprints=0;totalFrames=0;startLevel(0);}
      else if(state==='paused'){state='play';}
      else if(state==='levelDone'){totalFrames+=levelFrames;if(level+1<LEVELS.length)startLevel(level+1);else{state='win';overlayT=0;}}
      else if(state==='gameover'){lives=3;respawn();levelFrames=0;}
      else if(state==='win'){state='title';overlayT=0;}
    }
    anyPressed=false;jumpPressed=false;
    for(const c of coins)c.t+=0.08;
    return;
  }
  anyPressed=false;
  if(state==='dead'){
    P.deadT++;P.vy+=GRAV;P.y+=P.vy;
    if(P.deadT>75){lives--;if(lives<0){state='gameover';overlayT=0;}else respawn();}
    tickFx();return;
  }
  if(state==='flag'){
    overlayT++;flag.raise=Math.min(1,flag.raise+0.02);
    P.vy+=GRAV;P.vy=Math.min(P.vy,MAXFALL);collideY(P,false);
    if(P.onGround){P.vx=Math.min(P.vx+0.1,1.2);collideX(P);P.walk+=0.25;}
    if(overlayT>70){state='levelDone';overlayT=0;}
    tickFx();return;
  }

  levelFrames++;
  // horizontal: keyboard (digital) or stick (analog)
  const kdir=(held.right?1:0)-(held.left?1:0);
  const a=kdir!==0?kdir:axis;
  if(a!==0){const target=a*RUN;P.vx+=(target-P.vx)*(P.onGround?0.22:0.14);P.face=a>0?1:-1;P.walk+=Math.abs(P.vx)*0.09;}
  else{P.vx*=P.onGround?0.78:0.96;if(Math.abs(P.vx)<0.05)P.vx=0;}
  // jump
  const jumpHeld=held.jump||now<touchJumpUntil||(ptrs.size>(stickId===null?0:1));
  if(jumpPressed){P.buffer=7;jumpPressed=false;}
  if(P.onGround)P.coyote=6;else if(P.coyote>0)P.coyote--;
  if(P.buffer>0&&P.coyote>0){P.vy=JUMP;P.buffer=0;P.coyote=0;P.onGround=false;sfx.jump();P.sq=0.78;P.st=1.22;}
  if(P.buffer>0)P.buffer--;
  if(!jumpHeld&&P.vy<-2.6)P.vy=-2.6;
  P.vy+=GRAV;P.vy=Math.min(P.vy,MAXFALL);
  const wasGround=P.onGround;
  collideX(P);collideY(P,true);
  if(P.onGround&&!wasGround){P.sq=1.25;P.st=0.78;}
  P.sq+=(1-P.sq)*0.2;P.st+=(1-P.st)*0.2;
  P.x=clamp(P.x,0,GW*TILE-P.w);
  if(P.y>VH+40)die();

  const sx0=Math.floor((P.x+3)/TILE),sx1=Math.floor((P.x+P.w-4)/TILE),sy=Math.floor((P.y+P.h-3)/TILE);
  for(let c=sx0;c<=sx1;c++)if(at(c,sy)===T.SPIKE&&(P.y+P.h)>sy*TILE+5){die();break;}

  for(const c of coins){c.t+=0.08;if(!c.got&&Math.abs(c.x-(P.x+P.w/2))<11&&Math.abs(c.y-(P.y+P.h/2))<13){
    c.got=true;blueprints++;sfx.coin();popups.push({x:c.x,y:c.y-8,text:'+1',t:0});
    for(let i=0;i<5;i++)particles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.8)*2,life:24,color:'#3d5afe'});
    checkLife();}}

  for(const ck of checks)if(!ck.on&&P.x+P.w/2>ck.x+4){ck.on=true;sfx.check();spawn={x:ck.x+2,y:ck.row*TILE-P.h};popups.push({x:ck.x+8,y:ck.row*TILE-26,text:'CHECKPOINT',t:0});}
  if(P.x+P.w/2>=flag.x+6){state='flag';overlayT=0;sfx.flag();P.vx=0;}

  for(const en of enemies){
    if(en.dead){en.deadT++;if(en.fling){en.vy+=GRAV;en.x+=en.vx;en.y+=en.vy;en.ang+=0.25;}continue;}
    en.t+=0.1;en.vy+=GRAV;en.vy=Math.min(en.vy,MAXFALL);
    collideY(en,false);
    if(en.type==='cone'&&en.onGround){const ahead=en.vx>0?Math.floor((en.x+en.w+1)/TILE):Math.floor((en.x-1)/TILE);const below=Math.floor((en.y+en.h+1)/TILE);if(!solid(ahead,below))en.vx=-en.vx;}
    const speed=en.type==='cone'?0.55:1.05;en.vx=Math.sign(en.vx||-1)*speed;
    collideX(en);if(en.hitWall)en.vx=-Math.sign(en.vx)*speed;
    if(en.type==='bolt')en.ang+=en.vx/7;
    if(en.y>VH+40){en.dead=true;en.deadT=999;}
    if(Math.abs(en.x-P.x)<40&&overlap(P,en,1)){
      if(P.vy>0&&(P.y+P.h)-en.y<9+P.vy){killEnemy(en,false);P.vy=jumpHeld?-5.2:-4.0;P.y=en.y-P.h;sfx.stomp();P.sq=0.8;P.st=1.2;popups.push({x:en.x+en.w/2,y:en.y-8,text:'STOMP',t:0});}
      else die();
    }
  }
  enemies=enemies.filter(en=>!en.dead||en.deadT<(en.fling?200:28));
  const target=clamp(P.x-VW*0.42,0,Math.max(0,GW*TILE-VW));camX+=(target-camX)*0.16;
  tickFx();
}
function tickFx(){
  for(const b of bumps)b.t++;bumps=bumps.filter(b=>b.t<14);
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.08;p.life--;}particles=particles.filter(p=>p.life>0);
  for(const p of popups){p.t++;p.y-=0.5;}popups=popups.filter(p=>p.t<40);
  if(flashT>0)flashT--;
}

/* ---------- Drawing ---------- */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,VHv);g.addColorStop(0,L.sky[0]);g.addColorStop(1,L.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VHv);
  if(L.sky[0]==='#1b2440'){ctx.fillStyle='rgba(255,255,255,.7)';const r=rng(99);for(let i=0;i<70;i++){ctx.fillRect(((r()*VW*3-camX*0.05)%VW+VW)%VW,r()*(offY+120),1,1);}}
  ctx.fillStyle=L.lit?'rgba(255,255,255,.18)':'rgba(255,255,255,.75)';
  for(const c of L._clouds){const x=((c.x-camX*0.15)%1300+1300)%1300-60,y=20+c.y*(offY+90);ctx.beginPath();ctx.ellipse(x,y,26*c.s,8*c.s,0,0,6.283);ctx.ellipse(x+14*c.s,y-5*c.s,16*c.s,8*c.s,0,0,6.283);ctx.ellipse(x-14*c.s,y-3*c.s,14*c.s,7*c.s,0,0,6.283);ctx.fill();}
  drawSkyline(L._far,L._farW,0.3,L.far,offY+VH-24,false);
  drawSkyline(L._near,L._nearW,0.55,L.near,offY+VH-16,true);
}
function drawSkyline(list,period,f,color,base,detail){
  const off=((camX*f)%period+period)%period;
  for(let k=-1;k<=1;k++){
    for(const b of list){const x=b.x-off+k*period;if(x+b.w<0||x>VW)continue;
      ctx.fillStyle=color;ctx.fillRect(x,base-b.h,b.w,b.h);
      if(detail){
        ctx.fillStyle=L.lit?'rgba(255,220,140,.55)':'rgba(255,255,255,.35)';
        for(let wy=base-b.h+6;wy<base-6;wy+=9)for(let wx=x+4;wx<x+b.w-4;wx+=8)if(!L.lit||((wx*7+wy*13)|0)%5<2)ctx.fillRect(wx,wy,3,4);
        if(b.crane){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+b.w/2,base-b.h);ctx.lineTo(x+b.w/2,base-b.h-40);ctx.moveTo(x+b.w/2-30,base-b.h-40);ctx.lineTo(x+b.w/2+16,base-b.h-40);ctx.stroke();ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+b.w/2-24,base-b.h-40);ctx.lineTo(x+b.w/2-24,base-b.h-22);ctx.stroke();}
      }
    }
  }
}
function drawTiles(){
  const c0=Math.max(0,Math.floor(camX/TILE)-1),c1=Math.min(GW-1,c0+Math.ceil(VW/TILE)+2);
  for(let c=c0;c<=c1;c++)for(let r=0;r<ROWS;r++){
    const t=at(c,r);if(!t)continue;
    let x=c*TILE-camX,y=r*TILE;
    for(const b of bumps)if(b.c===c&&b.r===r)y-=Math.sin(b.t/14*Math.PI)*5;
    switch(t){
      case T.GROUND:ctx.fillStyle='#d2cbbf';ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='#efeae1';ctx.fillRect(x,y,TILE,3);ctx.fillStyle='#a79e90';ctx.fillRect(x,y+TILE-1,TILE,1);ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(x+TILE-1,y+3,1,TILE-4);break;
      case T.FILL:case T.BRICK:ctx.fillStyle='#b65c41';ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='#8f4530';ctx.fillRect(x,y+7,TILE,1);ctx.fillRect(x,y+15,TILE,1);ctx.fillRect(x+(r%2?3:11),y,1,7);ctx.fillRect(x+(r%2?11:3),y+8,1,7);break;
      case T.STEEL:ctx.fillStyle='#f08a24';ctx.fillRect(x,y+2,TILE,12);ctx.fillStyle='#c76a12';ctx.fillRect(x,y+11,TILE,3);ctx.fillStyle='#ffb86b';ctx.fillRect(x,y+2,TILE,2);ctx.fillStyle='#8a4a0e';ctx.fillRect(x+3,y+6,2,2);ctx.fillRect(x+11,y+6,2,2);break;
      case T.BLOCK:{const pulse=0.5+0.5*Math.sin(performance.now()/300+c);ctx.fillStyle='#3d5afe';ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='rgba(255,255,255,'+(0.18+0.12*pulse)+')';ctx.fillRect(x+1,y+1,TILE-2,2);ctx.fillRect(x+1,y+1,2,TILE-2);ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+1,y+TILE-3,TILE-2,2);ctx.fillRect(x+TILE-3,y+1,2,TILE-2);
        ctx.fillStyle='#fff';ctx.fillRect(x+5,y+4,6,8);ctx.fillStyle='#3d5afe';ctx.fillRect(x+6,y+6,4,1);ctx.fillRect(x+6,y+8,4,1);ctx.fillRect(x+6,y+10,3,1);break;}
      case T.USED:ctx.fillStyle='#9a9aa0';ctx.fillRect(x,y,TILE,TILE);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x+1,y+1,TILE-2,2);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x+1,y+TILE-3,TILE-2,2);break;
      case T.SPIKE:ctx.fillStyle='#737983';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x+i*5.33,y+TILE);ctx.lineTo(x+i*5.33+2.67,y+3);ctx.lineTo(x+(i+1)*5.33,y+TILE);ctx.closePath();ctx.fill();}ctx.fillStyle='#a8adb6';for(let i=0;i<3;i++)ctx.fillRect(x+i*5.33+2,y+5,1,9);break;
    }
  }
}
function drawSigns(){
  ctx.font='600 7px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const s of signs){const x=s.x-camX;if(x<-80||x>VW+80)continue;const y=s.row*TILE;
    ctx.fillStyle='#8f6b4a';ctx.fillRect(x+7,y+6,2,10);ctx.fillStyle='#d9b98f';rr(x-2,y,20,8,2);ctx.fill();
    const w=ctx.measureText(s.text).width+10;ctx.fillStyle='rgba(255,255,255,.92)';rr(x+8-w/2,y-14,w,11,5);ctx.fill();ctx.fillStyle='#1d1d1f';ctx.fillText(s.text,x+8,y-8.5);}
}
function drawChecks(){
  for(const ck of checks){const x=ck.x-camX;if(x<-40||x>VW+40)continue;const y=ck.row*TILE;
    ctx.fillStyle='#c9c9cf';ctx.fillRect(x+7,y-22,2,22);ctx.fillStyle=ck.on?'#3d5afe':'#b9b9bf';ctx.beginPath();ctx.moveTo(x+9,y-22);ctx.lineTo(x+20,y-18);ctx.lineTo(x+9,y-14);ctx.closePath();ctx.fill();}
}
function drawFlag(){
  const x=flag.x-camX;if(x<-60||x>VW+60)return;const base=flag.row*TILE,top=base-7*TILE;
  ctx.fillStyle='#9a9aa0';ctx.fillRect(x+6,base-3,8,3);ctx.fillStyle='#e8e8ec';ctx.fillRect(x+9,top,2,base-top-3);ctx.fillStyle='#3d5afe';ctx.beginPath();ctx.arc(x+10,top,3,0,6.283);ctx.fill();
  const fy=top+4+(1-flag.raise)*(5*TILE);ctx.fillStyle='#3d5afe';ctx.beginPath();ctx.moveTo(x+11,fy);ctx.lineTo(x+30,fy+6);ctx.lineTo(x+11,fy+12);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+14,fy+4,5,4);
}
function drawCoins(){
  for(const c of coins){if(c.got)continue;const x=c.x-camX;if(x<-20||x>VW+20)continue;const y=c.y+Math.sin(c.t)*1.5,sx=Math.max(0.2,Math.abs(Math.cos(c.t*0.7)));
    ctx.save();ctx.translate(x,y);ctx.scale(sx,1);ctx.fillStyle='#fff';rr(-3,-6,6,12,2);ctx.fill();ctx.fillStyle='#3d5afe';ctx.fillRect(-3,-1,6,3);ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(1,-6,2,12);ctx.restore();}
}
function drawEnemy(en){
  const x=en.x-camX;if(x<-30||x>VW+30)return;const cx=x+en.w/2,bottom=en.y+en.h;
  ctx.save();
  if(en.type==='cone'){
    const squash=en.dead?Math.max(0.25,1-en.deadT/10):1;
    ctx.translate(cx,bottom);ctx.scale(1,squash);ctx.rotate(en.dead?0:Math.sin(en.t*2)*0.07);
    ctx.fillStyle='#4a4a52';ctx.fillRect(-8,-2,16,2);
    ctx.fillStyle='#f28c28';ctx.beginPath();ctx.moveTo(-7,-2);ctx.lineTo(7,-2);ctx.lineTo(1.5,-14);ctx.lineTo(-1.5,-14);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(-4,-8,8,2);
    if(!en.dead){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-5,1.6,0,6.283);ctx.arc(2,-5,1.6,0,6.283);ctx.fill();ctx.fillStyle='#1d1d1f';const d=Math.sign(en.vx);ctx.beginPath();ctx.arc(-2+d*0.7,-5,0.8,0,6.283);ctx.arc(2+d*0.7,-5,0.8,0,6.283);ctx.fill();}
  } else {
    ctx.translate(cx,bottom-en.h/2);if(en.dead)ctx.scale(1,-1);ctx.rotate(en.ang);
    ctx.fillStyle='#8f949c';ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*6.8,Math.sin(a)*6.8);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#b9bec6';ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5-0.8);}ctx.closePath();ctx.fill();
    ctx.fillStyle='#5b6068';ctx.beginPath();ctx.arc(0,0,2.4,0,6.283);ctx.fill();
    if(!en.dead){ctx.rotate(-en.ang);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-2,-1,1.4,0,6.283);ctx.arc(2,-1,1.4,0,6.283);ctx.fill();ctx.fillStyle='#1d1d1f';ctx.beginPath();ctx.arc(-2+Math.sign(en.vx)*0.6,-1,0.7,0,6.283);ctx.arc(2+Math.sign(en.vx)*0.6,-1,0.7,0,6.283);ctx.fill();}
  }
  ctx.restore();
}
function drawPlayer(){
  const x=P.x-camX,cx=x+P.w/2,bottom=P.y+P.h;
  ctx.save();ctx.translate(cx,bottom);ctx.scale(P.sq,P.st);
  if(state==='dead')ctx.rotate(Math.sin(P.deadT/6)*0.3);
  const f=P.face,run=P.onGround&&Math.abs(P.vx)>0.3,step=Math.sin(P.walk)*3;
  ctx.fillStyle='#2a2a30';
  if(run){ctx.fillRect(-6+step,-3,5,3);ctx.fillRect(1-step,-3,5,3);}else if(!P.onGround){ctx.fillRect(-6,-4,5,3);ctx.fillRect(1,-2,5,3);}else{ctx.fillRect(-6,-3,5,3);ctx.fillRect(1,-3,5,3);}
  ctx.fillStyle='#3d5afe';rr(-7,-15,14,13,5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.18)';rr(-5,-14,5,4,2);ctx.fill();
  ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.arc(0,-14,7.5,Math.PI,0);ctx.closePath();ctx.fill();ctx.fillStyle='#e6b422';ctx.fillRect(-9,-15,18,2.2);ctx.fillStyle='#fff';ctx.fillRect(-1,-21,2,5);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f*2-2.2,-9,2.1,0,6.283);ctx.arc(f*2+2.2,-9,2.1,0,6.283);ctx.fill();
  ctx.fillStyle='#1d1d1f';ctx.beginPath();ctx.arc(f*2-2.2+f*0.9,-9,1,0,6.283);ctx.arc(f*2+2.2+f*0.9,-9,1,0,6.283);ctx.fill();
  ctx.restore();
}
function drawFx(){
  for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/10);ctx.fillStyle=p.color;ctx.fillRect(p.x-camX-1,p.y-1,2,2);}ctx.globalAlpha=1;
  ctx.font='700 8px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of popups){ctx.globalAlpha=Math.min(1,(40-p.t)/12);ctx.fillStyle='#fff';ctx.fillText(p.text,p.x-camX+0.6,p.y+0.6);ctx.fillStyle='#1d1d1f';ctx.fillText(p.text,p.x-camX,p.y);}ctx.globalAlpha=1;
}
function drawStick(){
  if(!stick||state!=='play')return;
  ctx.save();ctx.globalAlpha=0.55;
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(stick.x0,stick.y0,26,0,6.283);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(stick.x0,stick.y0,26,0,6.283);ctx.fill();
  const kx=stick.x0+clamp(stick.x-stick.x0,-26,26);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(kx,stick.y0,10,0,6.283);ctx.fill();
  ctx.restore();
}
function pill(x,y,w,h){ctx.fillStyle='rgba(255,255,255,.82)';rr(x,y,w,h,h/2);ctx.fill();}
function fmt(fr){const s=Math.floor(fr/60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
let pauseRect=null,panelRect=null;
function drawHUD(){
  const top=7+inset.t,left=8+inset.l,right=VW-8-inset.r;
  ctx.textBaseline='middle';
  ctx.font='600 9px '+FONT;ctx.textAlign='left';const lt=VW<420?'SITE '+(level+1):'SITE '+(level+1)+'  ·  '+L.name.toUpperCase();const lw=ctx.measureText(lt).width+16;pill(left,top,lw,16);ctx.fillStyle='#1d1d1f';ctx.fillText(lt,left+8,top+8.5);
  const bt=String(blueprints);ctx.font='600 10px '+FONT;const bw=ctx.measureText(bt).width+30;const bx=VW/2-bw/2;pill(bx,top,bw,16);ctx.fillStyle='#e4e4ea';rr(bx+9,top+3,6,10,2);ctx.fill();ctx.strokeStyle='#b4b4bc';ctx.lineWidth=0.8;ctx.stroke();ctx.fillStyle='#3d5afe';ctx.fillRect(bx+9,top+7,6,2);ctx.fillStyle='#1d1d1f';ctx.textAlign='left';ctx.fillText(bt,bx+21,top+8.5);
  // pause button (tappable) then lives + time
  pauseRect={x:right-18,y:top-2,w:20,h:20};pill(right-16,top,16,16);ctx.fillStyle='#1d1d1f';ctx.fillRect(right-11,top+4.5,2,7);ctx.fillRect(right-7,top+4.5,2,7);
  const tt=fmt(levelFrames);ctx.font='600 9px '+FONT;const tw=ctx.measureText(tt).width;const hw=lives*9+tw+30;const hx=right-22-hw;pill(hx,top,hw,16);
  for(let i=0;i<lives;i++)heart(hx+12+i*9,top+8.5,3.2,'#ff4d6d');
  ctx.fillStyle='#1d1d1f';ctx.textAlign='right';ctx.fillText(tt,hx+hw-8,top+8.5);
}
function heart(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y+r);ctx.bezierCurveTo(x-r*1.6,y-r*0.3,x-r*0.8,y-r*1.6,x,y-r*0.5);ctx.bezierCurveTo(x+r*0.8,y-r*1.6,x+r*1.6,y-r*0.3,x,y+r);ctx.fill();}
function panel(w,h){w=Math.min(w,VW-20);const x=VW/2-w/2,y=VHv/2-h/2;ctx.fillStyle='rgba(20,20,26,.28)';ctx.fillRect(0,0,VW,VHv);ctx.fillStyle='rgba(255,255,255,.94)';rr(x,y,w,h,18);ctx.fill();panelRect={x,y,w,h};return panelRect;}
function key(x,y,w,label){ctx.fillStyle='#fff';rr(x,y,w,14,4);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#1d1d1f';ctx.font='600 8px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+7.5);}
function hint(text,y){ctx.globalAlpha=0.55+0.45*Math.sin(overlayT/14);ctx.fillStyle='#3d5afe';ctx.font='600 10px '+FONT;ctx.textAlign='center';ctx.fillText(text,VW/2,y);ctx.globalAlpha=1;}
function menuButton(x,y,w,label,act,primary){ctx.fillStyle=primary?'#3d5afe':'#f2f2f7';rr(x,y,w,22,11);ctx.fill();ctx.fillStyle=primary?'#fff':'#1d1d1f';ctx.font='600 9px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x+w/2,y+11.5);menuHits.push({x,y,w,h:22,act});}
function gestureIcons(y){
  // drag icon
  const gx=VW/2-58;ctx.strokeStyle='#1d1d1f';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(gx,y,10,0,6.283);ctx.stroke();ctx.fillStyle='#3d5afe';ctx.beginPath();ctx.arc(gx+4,y,4,0,6.283);ctx.fill();
  ctx.fillStyle='#1d1d1f';ctx.beginPath();ctx.moveTo(gx-16,y);ctx.lineTo(gx-12,y-3);ctx.lineTo(gx-12,y+3);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(gx+16,y);ctx.lineTo(gx+12,y-3);ctx.lineTo(gx+12,y+3);ctx.closePath();ctx.fill();
  // tap / swipe-up icon
  const tx=VW/2+58;ctx.fillStyle='#3d5afe';ctx.beginPath();ctx.arc(tx,y+4,4,0,6.283);ctx.fill();ctx.strokeStyle='#1d1d1f';ctx.beginPath();ctx.arc(tx,y+4,9,0,6.283);ctx.stroke();
  ctx.fillStyle='#1d1d1f';ctx.fillRect(tx+14,y-8,1.6,14);ctx.beginPath();ctx.moveTo(tx+14.8,y-12);ctx.lineTo(tx+10.5,y-6);ctx.lineTo(tx+19,y-6);ctx.closePath();ctx.fill();
  ctx.font='600 7px '+FONT;ctx.textAlign='center';ctx.fillStyle='#86868b';ctx.fillText('DRAG TO MOVE',gx,y+20);ctx.fillText('TAP OR SWIPE UP TO JUMP',tx,y+20);
}
function drawOverlay(){
  ctx.textBaseline='middle';menuHits=[];
  if(state==='title'){
    const p=panel(320,200);
    ctx.fillStyle='#86868b';ctx.font='600 8px '+FONT;ctx.textAlign='center';ctx.fillText('A TELPE GAME',VW/2,p.y+22);
    ctx.fillStyle='#1d1d1f';ctx.font='700 30px '+FONT;ctx.fillText('Groundwork',VW/2,p.y+48);
    ctx.fillStyle='#4a4a52';ctx.font='400 '+(VW<300?8.5:VW<340?9:10)+'px '+FONT;ctx.fillText('Run across the site. Stomp the cones and bolts.',VW/2,p.y+74);ctx.fillText('Collect blueprints. Reach the flag.',VW/2,p.y+88);
    if(touchDevice){gestureIcons(p.y+118);}
    else{key(VW/2-70,p.y+106,22,'◀');key(VW/2-44,p.y+106,22,'▶');key(VW/2-14,p.y+106,24,'▲');key(VW/2+14,p.y+106,56,'SPACE');
      ctx.fillStyle='#86868b';ctx.font='400 8px '+FONT;ctx.fillText('MOVE                    JUMP',VW/2-14,p.y+128);ctx.fillText('or drag with the mouse to move, click to jump',VW/2,p.y+142);}
    hint((touchDevice?'Tap to start':'Tap or press any key to start')+(best>0?'  ·  Best: Site '+best:''),p.y+176);
    if(touchDevice&&VHv>VW*1.1){ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='600 9px '+FONT;ctx.textAlign='center';ctx.fillText('Turn your phone sideways for a bigger view',VW/2,p.y+p.h+22);}
  } else if(state==='paused'){
    const p=panel(230,canFull?146:118);
    ctx.fillStyle='#1d1d1f';ctx.font='700 20px '+FONT;ctx.textAlign='center';ctx.fillText('Paused',VW/2,p.y+26);
    let y=p.y+46;const bw=190,bx=VW/2-bw/2;
    menuButton(bx,y,bw,'Resume',()=>{state='play';},true);y+=28;
    menuButton(bx,y,bw,muted?'Sound: off':'Sound: on',()=>{toggleMute();});y+=28;
    if(canFull){menuButton(bx,y,bw,fsEl()?'Exit fullscreen':'Fullscreen',()=>{toggleFull();});y+=28;}
    menuButton(bx,y,bw,'Back to Telpe',()=>{location.href='index.html';});
  }
  else if(state==='levelDone'){const p=panel(260,120);ctx.fillStyle='#86868b';ctx.font='600 8px '+FONT;ctx.textAlign='center';ctx.fillText('SITE '+(level+1)+' COMPLETE',VW/2,p.y+22);ctx.fillStyle='#1d1d1f';ctx.font='700 22px '+FONT;ctx.fillText(L.name,VW/2,p.y+46);ctx.fillStyle='#4a4a52';ctx.font='400 10px '+FONT;ctx.fillText('Time '+fmt(levelFrames)+'   ·   Blueprints '+blueprints,VW/2,p.y+72);hint(level+1<LEVELS.length?'Tap for the next site':'Tap to continue',p.y+100);}
  else if(state==='gameover'){const p=panel(260,110);ctx.fillStyle='#1d1d1f';ctx.font='700 22px '+FONT;ctx.textAlign='center';ctx.fillText('Site closed',VW/2,p.y+36);ctx.fillStyle='#4a4a52';ctx.font='400 10px '+FONT;ctx.fillText('Out of hard hats. You keep your blueprints.',VW/2,p.y+60);hint('Tap to try again',p.y+88);}
  else if(state==='win'){const p=panel(300,130);ctx.fillStyle='#86868b';ctx.font='600 8px '+FONT;ctx.textAlign='center';ctx.fillText('ALL SITES COMPLETE',VW/2,p.y+22);ctx.fillStyle='#1d1d1f';ctx.font='700 24px '+FONT;ctx.fillText('Topped out.',VW/2,p.y+48);ctx.fillStyle='#4a4a52';ctx.font='400 10px '+FONT;ctx.fillText('Total time '+fmt(totalFrames)+'   ·   Blueprints '+blueprints,VW/2,p.y+76);hint('Tap to play again',p.y+106);}
}
let hintShown=false;
function drawUnderground(){
  const depth=VHv-offY-VH;if(depth<=0)return;
  // the ground continues below the world: dark brick, the thumb's territory
  ctx.fillStyle='#2b1b17';ctx.fillRect(0,VH,VW,depth);
  ctx.fillStyle='rgba(255,255,255,.05)';
  for(let y=VH;y<VH+depth;y+=8){const o=((y/8)|0)%2?8:0;for(let x=-16-(camX%16);x<VW;x+=16){ctx.fillRect(x+o,y,15,7);}}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,VH,VW,4);
  if(touchDevice&&state==='play'&&!hintShown&&depth>60){
    const a=clamp(1-(levelFrames-300)/90,0,1);if(a<=0)return;
    ctx.save();ctx.globalAlpha=0.9*a;const y=VH+depth/2;
    ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(VW/2-54,y-8,12,0,6.283);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(VW/2-50,y-8,5,0,6.283);ctx.fill();
    ctx.beginPath();ctx.moveTo(VW/2-74,y-8);ctx.lineTo(VW/2-69,y-12);ctx.lineTo(VW/2-69,y-4);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(VW/2-34,y-8);ctx.lineTo(VW/2-39,y-12);ctx.lineTo(VW/2-39,y-4);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(VW/2+54,y-6,5,0,6.283);ctx.fill();ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(VW/2+54,y-6,11,0,6.283);ctx.stroke();
    ctx.fillRect(VW/2+70,y-20,1.6,16);ctx.beginPath();ctx.moveTo(VW/2+70.8,y-24);ctx.lineTo(VW/2+66,y-17);ctx.lineTo(VW/2+75.6,y-17);ctx.closePath();ctx.fill();
    ctx.font='600 7px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText('DRAG TO MOVE',VW/2-54,y+14);ctx.fillText('TAP OR SWIPE UP TO JUMP',VW/2+54,y+14);
    ctx.fillText('(anywhere on the screen)',VW/2,y+30);
    ctx.restore();
  }
}
function draw(){
  ctx.setTransform(S,0,0,S,0,0);
  drawSky();
  ctx.save();ctx.translate(0,offY);
  drawTiles();drawUnderground();drawSigns();drawChecks();drawFlag();drawCoins();
  for(const en of enemies)drawEnemy(en);
  drawPlayer();drawFx();
  ctx.restore();
  drawStick();drawHUD();
  if(flashT>0){ctx.fillStyle='rgba(255,80,80,'+(flashT/40)+')';ctx.fillRect(0,0,VW,VHv);}
  if(state!=='play'&&state!=='dead'&&state!=='flag')drawOverlay();
}

/* ---------- Loop & fit ---------- */
let last=0,acc=0;
function loop(ts){
  if(!last)last=ts;let dt=ts-last;last=ts;if(dt>100)dt=100;acc+=dt;
  while(acc>=1000/60){update();acc-=1000/60;}
  draw();requestAnimationFrame(loop);
}
function fit(){
  const b=stage.getBoundingClientRect();const W=Math.max(1,b.width),H=Math.max(1,b.height);
  if(document.body.classList.contains('full')){
    // cover the whole screen: at least 16 columns and all 17 rows visible. Extra height becomes sky
    // above and, in portrait, an underground strip below where the thumb can drag without hiding the action.
    scale=Math.min(W/(16*TILE),H/VH);
    if(W/scale>48*TILE)scale=W/(48*TILE);
    VW=Math.round(W/scale);VHv=Math.max(VH,Math.round(H/scale));
    cv.style.width=W+'px';cv.style.height=H+'px';
    offY=VHv-VH>40?clamp(Math.round(VHv*0.60-VH),0,VHv-VH):VHv-VH;
  } else {
    VW=30*TILE;VHv=VH;scale=Math.min(W/VW,Math.max(1,H-12)/VHv);
    cv.style.width=Math.floor(VW*scale)+'px';cv.style.height=Math.floor(VHv*scale)+'px';
    offY=0;
  }
  cv.width=VW*S;cv.height=VHv*S;
  camX=clamp(camX,0,Math.max(0,GW*TILE-VW));readInsets();
}
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);
build(0);spawnAt(2*TILE+2,groundTop(2)*TILE-P.h);updateMode();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{fit();requestAnimationFrame(loop);});
})();
</script>
