# Ireland.gov concept: one request per link used in the guides, to confirm each one answers (the build sandbox
# has no open internet). Sites whose robots.txt disallows or refuses automated readers are skipped and reported as
# "robots". The result and a log are committed to data/ie/.
name: Ireland.gov concept data
on:
  workflow_dispatch:
  push:
    paths:
      - tools/ie_check_links.py
      - content/ie/*.json
      - .github/workflows/ie-data.yml
concurrency:
  group: ie-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check the links used in the guides
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p data/ie
          python3 -u tools/ie_check_links.py 2>&1 | tee /tmp/links.log
      - name: Commit the results and the logs
        run: |
          git config user.name "telpe-concept-bot"
          git config user.email "telpe-concept-bot@users.noreply.github.com"
          { echo "links: ${{ steps.links.outcome }} · $(date -u +%FT%TZ)"; tail -c 40000 /tmp/links.log; } > data/ie/run.log
          git add data/ie
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Ireland.gov concept: link check ${{ steps.links.outcome }}"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 10; done
