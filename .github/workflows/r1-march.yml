name: Rebuild the first-round march from the TSE open data
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated UFs to process (empty = all 27 + ZZ)"
        required: false
        default: ""
  push:
    paths:
      - tools/build_r1_march.py
      - .github/workflows/r1-march.yml
concurrency:
  group: r1-march
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build data/r1-march.json
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: python3 -u tools/build_r1_march.py
      - name: Commit
        run: |
          git config user.name "apuracao-bot"
          git config user.email "apuracao-bot@users.noreply.github.com"
          git add data/r1-march.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "First-round march rebuilt from the TSE bulletins"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 10; done
