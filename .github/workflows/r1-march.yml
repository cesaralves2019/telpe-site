name: Rebuild the first-round march from the TSE open data
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated UFs to process (empty = all 27 + ZZ)"
        required: false
        default: ""
  push:
    paths:
      - tools/build_r1_march.py
      - .github/workflows/r1-march.yml
concurrency:
  group: r1-march
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build data/r1-march.json
        id: build
        continue-on-error: true
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -o pipefail
          python3 -u tools/build_r1_march.py 2>&1 | tee /tmp/r1-march.log
      - name: Commit (the log always, the data when the build succeeded)
        run: |
          git config user.name "apuracao-bot"
          git config user.email "apuracao-bot@users.noreply.github.com"
          { echo "outcome: ${{ steps.build.outcome }} · $(date -u +%FT%TZ)"; tail -c 60000 /tmp/r1-march.log; } > data/r1-march.log
          git add data/r1-march.log
          [ -f data/r1-march.json ] && git add data/r1-march.json
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "First-round march build: ${{ steps.build.outcome }}"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break || sleep 10; done
