<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telpe AI</title>
<meta name="description" content="Telpe is an AI company that shapes the built world.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: one screen. Headline on top, and beneath it a living massing model — thin isometric
   lines on drafting-paper grid, blocks rising from the ground, holding, dissolving, rising again.
   Hidden edges dashed, the way a draughtsman would draw them. Brand top-left, one-line footer. */
:root{
  --bg:#fbfbfd;
  --fg:#1d1d1f;
  --fg-2:#86868b;
  --line:rgba(29,29,31,.08);
  --accent:#3d5afe;
  --ink:29,29,31;
  --accent-rgb:61,90,254;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f7;--fg-2:#8e8e93;--line:rgba(245,245,247,.10);--accent:#5b78ff;--ink:245,245,247;--accent-rgb:91,120,255;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f7;--fg-2:#8e8e93;--line:rgba(245,245,247,.10);--accent:#5b78ff;--ink:245,245,247;--accent-rgb:91,120,255;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}

.page{min-height:100%;display:flex;flex-direction:column;padding-inline:clamp(20px,4vw,48px)}

header{display:flex;align-items:center;justify-content:space-between;height:64px;padding-top:env(safe-area-inset-top,0px);flex:none}
.hlinks{display:flex;gap:26px}
.play{font-size:14px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px}
.play:hover{color:var(--fg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;font-size:16px}
.brand svg{width:20px;height:20px}

main{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(36px,7vh,96px)}
h1{
  margin:0;font-weight:600;letter-spacing:-.045em;line-height:.96;text-wrap:balance;
  font-size:clamp(46px,9.5vw,124px);
  opacity:0;transform:translateY(14px);animation:in 1.3s cubic-bezier(.2,.7,.2,1) .2s forwards;
}
h1 .soft{display:block;color:var(--fg-2);font-weight:300}
.line{
  margin:28px auto 0;max-width:34ch;color:var(--fg-2);font-size:clamp(17px,1.7vw,21px);line-height:1.45;text-wrap:balance;
  opacity:0;animation:in 1.3s cubic-bezier(.2,.7,.2,1) .8s forwards;
}
@keyframes in{to{opacity:1;transform:none}}

.model{flex:1;width:min(1100px,100%);min-height:clamp(240px,38vh,460px);position:relative;margin-top:clamp(16px,3vh,40px)}
.model canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

footer{flex:none;display:flex;justify-content:center;padding-block:22px calc(26px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--fg-2);letter-spacing:.02em}

@media (prefers-reduced-motion:reduce){h1,.line{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page">
  <header>
    <a class="brand" href="#" aria-label="Telpe AI">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="13" r="2.4" fill="var(--accent)"/></svg>
      Telpe
    </a>
    <nav class="hlinks" aria-label="Pages">
      <a class="play" href="studio.html">Studio</a>
      <a class="play" href="devotional.html">Devotional</a>
      <a class="play" href="game.html">Play</a>
    </nav>
  </header>

  <main>
    <h1>Plan it.<span class="soft">Telpe builds it.</span></h1>
    <p class="line">Telpe is an AI company that shapes the built world.</p>
    <div class="model"><canvas id="iso" aria-hidden="true"></canvas></div>
  </main>

  <footer>© <span id="year">2026</span> Telpe AI</footer>
</div>

<script>
(function(){
  document.getElementById('year').textContent=new Date().getFullYear();

  var c=document.getElementById('iso'),host=c.parentElement,ctx=c.getContext('2d');
  var dpr=Math.min(devicePixelRatio||1,2),W=0,H=0,s=10,ox=0,oy=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var N=10,HMAX=6,K=0.866;              // grid cells, max block height (cells), cos 30°
  var ink,acc;
  function readColors(){
    var cs=getComputedStyle(document.documentElement);
    ink=cs.getPropertyValue('--ink').trim()||'29,29,31';
    acc=cs.getPropertyValue('--accent-rgb').trim()||'61,90,254';
  }
  readColors();
  var mq=matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener)mq.addEventListener('change',readColors);

  function size(){
    var b=host.getBoundingClientRect();W=b.width;H=b.height;
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    s=Math.min((W*0.92)/(2*K*N),(H*0.92)/(N+HMAX));
    ox=W/2;oy=(H-(N+HMAX)*s)/2+HMAX*s;
  }
  function P(x,y,z){return [ox+(x-y)*s*K, oy+(x+y)*s*0.5-z*s];}

  // A random, non-overlapping arrangement of blocks on the grid: a massing study.
  var blocks=[];
  function layout(){
    blocks=[];var tries=0,count=7+Math.floor(Math.random()*4);
    while(blocks.length<count&&tries++<400){
      var w=1+Math.floor(Math.random()*3),d=1+Math.floor(Math.random()*3);
      var x=Math.floor(Math.random()*(N-w+1)),y=Math.floor(Math.random()*(N-d+1));
      var ok=true;
      for(var i=0;i<blocks.length;i++){var b=blocks[i];
        if(x<b.x+b.w+1&&x+w+1>b.x&&y<b.y+b.d+1&&y+d+1>b.y){ok=false;break;}}
      if(!ok)continue;
      var h=1+Math.random()*(HMAX-1.2);if(Math.random()<.25)h=Math.min(HMAX,h+1.5);
      blocks.push({x:x,y:y,w:w,d:d,h:h,delay:(x+y)*0.09+Math.random()*0.5});
    }
    var tallest=0;for(var j=0;j<blocks.length;j++)if(blocks[j].h>blocks[tallest].h)tallest=j;
    if(blocks.length)blocks[tallest].key=true;
  }

  function ease(t){t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3);}
  function seg(a,b){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);}

  function drawGrid(alpha){
    ctx.lineWidth=1;ctx.strokeStyle='rgba('+ink+','+(0.07*alpha).toFixed(3)+')';ctx.setLineDash([]);
    ctx.beginPath();
    for(var i=0;i<=N;i++){seg(P(i,0,0),P(i,N,0));seg(P(0,i,0),P(N,i,0));}
    ctx.stroke();
  }

  function drawBlock(b,p,alpha){
    var h=b.h*p; if(h<=0.001)return;
    var x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.d;
    var A0=P(x0,y0,0),B0=P(x1,y0,0),C0=P(x1,y1,0),D0=P(x0,y1,0);
    var A1=P(x0,y0,h),B1=P(x1,y0,h),C1=P(x1,y1,h),D1=P(x0,y1,h);
    // hidden edges, dashed and faint: the back vertical and the two base edges meeting it
    ctx.setLineDash([3,4]);ctx.lineWidth=1;
    ctx.strokeStyle='rgba('+ink+','+(0.13*alpha).toFixed(3)+')';
    ctx.beginPath();seg(A0,B0);seg(A0,D0);seg(A0,A1);ctx.stroke();
    // visible edges
    ctx.setLineDash([]);
    var col=b.key?acc:ink,a=b.key?0.75:0.42;
    ctx.strokeStyle='rgba('+col+','+(a*alpha).toFixed(3)+')';
    ctx.beginPath();
    seg(B0,C0);seg(C0,D0);                 // front base
    seg(B0,B1);seg(C0,C1);seg(D0,D1);      // front verticals
    seg(A1,B1);seg(B1,C1);seg(C1,D1);seg(D1,A1); // top face
    ctx.stroke();
    // top corners
    ctx.fillStyle='rgba('+col+','+(0.9*alpha).toFixed(3)+')';
    [A1,B1,C1,D1].forEach(function(q){ctx.beginPath();ctx.arc(q[0],q[1],1.4,0,6.283);ctx.fill();});
  }

  // Cycle: rise (staggered) → hold → dissolve → new arrangement
  var GROW=1.8,HOLD=6.5,FADE=1.6,start=null,phaseEnd=0;
  function maxDelay(){var m=0;for(var i=0;i<blocks.length;i++)m=Math.max(m,blocks[i].delay);return m;}
  function frame(ts){
    if(start===null){start=ts;phaseEnd=maxDelay()+GROW+HOLD;}
    var t=(ts-start)/1000;
    var alpha=1;
    if(t>phaseEnd){alpha=1-ease((t-phaseEnd)/FADE);if(t>phaseEnd+FADE){layout();start=ts;t=0;alpha=1;phaseEnd=maxDelay()+GROW+HOLD;}}
    ctx.clearRect(0,0,W,H);
    drawGrid(1);
    for(var i=0;i<blocks.length;i++){var b=blocks[i];drawBlock(b,ease((t-b.delay)/GROW),alpha);}
    requestAnimationFrame(frame);
  }

  size();layout();
  if(window.ResizeObserver){new ResizeObserver(function(){size();}).observe(host);}else{addEventListener('resize',size);}
  if(reduce){ctx.clearRect(0,0,W,H);drawGrid(1);for(var i=0;i<blocks.length;i++)drawBlock(blocks[i],1,1);}
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
